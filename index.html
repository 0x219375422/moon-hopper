<title>Moon Hopper</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0820;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,sans-serif;color:#fff}

.hide{display:none!important}

function tex(r){r=Math.round(r);if(TC[r])return TC[r];if(!MI.complete||!MI.naturalWidth)return null;const s=r*2+4,cv=document.createElement('canvas');cv.width=cv.height=s*D;const g=cv.getContext('2d');g.scale(D,D);g.drawImage(MI,2,2,r*2,r*2);return TC[r]=cv}
function shd(r){r=Math.round(r);if(SC[r])return SC[r];const p=14,s=r*2+p*2,cv=document.createElement('canvas');cv.width=cv.height=s*D;const g=cv.getContext('2d');g.scale(D,D);const c=s/2;
let q=g.createRadialGradient(c,c,0,c,c,r+p);q.addColorStop(0,'rgba(170,200,255,0)');q.addColorStop((r-2)/(r+p),'rgba(170,200,255,0)');q.addColorStop(r/(r+p),'rgba(170,200,255,.45)');q.addColorStop(1,'rgba(170,200,255,0)');g.fillStyle=q;g.beginPath();g.arc(c,c,r+p,0,Math.PI*2);g.fill();
q=g.createRadialGradient(c-r*.35,c-r*.45,r*.1,c,c,r);q.addColorStop(0,'rgba(255,255,255,.12)');q.addColorStop(.6,'rgba(0,0,20,0)');q.addColorStop(1,'rgba(0,0,30,.6)');g.fillStyle=q;g.beginPath();g.arc(c,c,r,0,Math.PI*2);g.fill();
